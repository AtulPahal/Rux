[workspace]
resolver = "2"
members = [
    "crates/rux-core",
    "crates/rux-proc",
    "crates/rux-vm",
    "crates/rux-inject",
    "crates/rux-ffi",
    "crates/rux-cli",
    "crates/rux-payload",
]

[workspace.package]
version = "0.2.0"
authors = ["Nexus42", "Rux Contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nexus42Dev/MacSploit"
keywords = ["macos", "mach-o", "injector", "dylib", "darwin"]

[workspace.dependencies]
rux-core = { path = "crates/rux-core" }
rux-proc = { path = "crates/rux-proc" }
rux-vm = { path = "crates/rux-vm" }
rux-inject = { path = "crates/rux-inject" }
rux-ffi = { path = "crates/rux-ffi" }
rux-payload = { path = "crates/rux-payload" }

libc = "0.2"
mach2 = "0.7"
parking_lot = "0.12"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
